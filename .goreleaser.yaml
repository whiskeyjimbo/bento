# GoReleaser v2 configuration for bento
# Reference: https://goreleaser.com
version: 2

project_name: bento

env:
  - GOWORK=off

before:
  hooks:
    # download, not tidy: a tidy that rewrites go.mod mid-release makes the
    # published archive differ from the tag it claims to be built from.
    - go mod download

builds:
  - id: bento
    main: ./cmd/bento
    binary: bento
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
      # Keeps the passwd lookup the credential shields anchor on out of libc NSS, where
      # LD_PRELOAD would put it back under the caller's control. See the Makefile.
      - -tags=osusergo
    # The stamp and the archive mtimes come from the commit, never the wall clock,
    # so a published binary can be reproduced from its tag and compared against the
    # checksum. See the same reasoning behind SOURCE_DATE_EPOCH in the Makefile.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    goos:
      - linux
    #  - darwin
    goarch:
      - amd64
    #  - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - SECURITY.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    # Subjects here are scoped - `docs(denylist): ...` - so an unscoped `^docs:`
    # would match nothing.
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^style(\(.+\))?:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

sboms:
  - id: archive
    artifacts: archive

# Keyless: the signature carries the workflow identity that produced it, so a
# consumer can verify the archives came from this repo's tagged release run
# rather than from someone with a leaked key. Signing the checksum file covers
# every archive through it. The .sigstore.json suffix is the convention consumers
# and release scanners match on; --new-bundle-format is pinned explicitly so the
# name keeps describing the bytes if cosign's default ever moves back.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --new-bundle-format=true
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true
