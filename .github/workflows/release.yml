name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The test suite runs real probes inside real bwrap sandboxes; without it
      # those tests skip and the gate would pass without exercising the boundary.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - run: make check

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signs against the workflow's OIDC identity, so there is no
      # private key to hold: the signature attests to this repo, tag, and workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the version and the changelog range from tag history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
