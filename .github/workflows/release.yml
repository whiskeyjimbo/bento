name: release

on:
  push:
    tags:
      - "v*"
  # The gate depends on host state a runner does not have by default (bwrap, userns,
  # the firejail corpus), so it needs to be runnable without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  release:
    needs: gate
    # A manual dispatch runs the gate only; publishing a release needs the tag that
    # GoReleaser derives the version and changelog range from.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signs against the workflow's OIDC identity, so there is no
      # private key to hold: the signature attests to this repo, tag, and workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the version and the changelog range from tag history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # cosign-installer publishes no floating v4 tag, unlike every other action here,
      # so the major version has to be pinned to a point release.
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
