name: release

on:
  push:
    tags:
      - "v*"
  # The gate depends on host state a runner does not have by default (bwrap, userns,
  # the firejail corpus), so it needs to be runnable without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  release:
    needs: gate
    # A manual dispatch runs the gate only; publishing a release needs the tag that
    # GoReleaser derives the version and changelog range from.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    permissions:
      contents: write
      # Keyless cosign signs against the workflow's OIDC identity, so there is no
      # private key to hold: the signature attests to this repo, tag, and workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser derives the version and the changelog range from tag history.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The three third-party actions in this job all touch the signing and publishing
      # path, so they are pinned to a commit: a tag can be moved under us, a commit cannot.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # checksums.txt is already in sha256sum format, which is exactly the subject
      # list the generator wants: every published artifact becomes a subject of the
      # attestation, so slsa-verifier can check an archive directly.
      - id: hashes
        run: echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  # SLSA build provenance, attached to the release as bento.intoto.jsonl.
  provenance:
    needs: release
    permissions:
      # The generator reads this run's metadata to describe how the artifacts were built.
      actions: read
      id-token: write
      contents: write
    # Referenced by tag, not by commit, unlike the actions above: the builder checks
    # its own ref against the trusted builder identity baked into the attestation,
    # and a commit ref fails that check.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      # Named rather than derived, so the verification command in SECURITY.md stays
      # correct as the archive set changes.
      provenance-name: bento.intoto.jsonl
