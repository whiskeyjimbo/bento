name: release

on:
  push:
    tags:
      - "v*"
  # The gate depends on host state a runner does not have by default (bwrap, userns,
  # the firejail corpus), so it needs to be runnable without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The test suite runs real probes inside real bwrap sandboxes, and the denylist
      # audit diffs against the locally installed firejail and AppArmor profiles;
      # without them those tests skip and the gate would pass without exercising the
      # boundary. BENTO_REQUIRE_TEST_DEPS turns such a skip into a failure, so they
      # have to be present rather than merely nice to have.
      - name: Install sandbox test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap firejail

      # Ubuntu 24.04 ships an AppArmor restriction that denies unprivileged user
      # namespaces to unconfined binaries, which is exactly what bwrap needs. The
      # runner is a throwaway VM, so lifting it there costs nothing.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # A runner that still refuses userns fails ~80 sandbox tests with one line each
      # and no cause. Probing the levers first says which one is wrong.
      - name: Probe the sandbox preconditions
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces || true
          bwrap --unshare-user --dev-bind / / true && echo "bwrap userns OK"

      - run: make check

  release:
    needs: gate
    # A manual dispatch runs the gate only; publishing a release needs the tag that
    # GoReleaser derives the version and changelog range from.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signs against the workflow's OIDC identity, so there is no
      # private key to hold: the signature attests to this repo, tag, and workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the version and the changelog range from tag history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # cosign-installer publishes no floating v4 tag, unlike every other action here,
      # so the major version has to be pinned to a point release.
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
