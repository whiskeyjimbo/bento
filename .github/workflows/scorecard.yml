name: OpenSSF Scorecard

on:
  # Run weekly on Sundays at midnight UTC
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Declare minimal permissions needed
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF results to GitHub Code Scanning tab
      security-events: write
      # Needed to sign OIDC tokens for Scorecard REST API publishing
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc #2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results to public Scorecard API (required for badge)
          publish_results: true

      - name: Upload SARIF results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 #4.15.5
        with:
          sarif_file: results.sarif
          category: scorecard
