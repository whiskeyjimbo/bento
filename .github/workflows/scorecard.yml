name: OpenSSF Scorecard

on:
  # Run weekly on Sundays at midnight UTC
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Declare minimal permissions needed
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF results to GitHub Code Scanning tab
      security-events: write
      # Needed to sign OIDC tokens for Scorecard REST API publishing
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e #2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results to public Scorecard API (required for badge)
          publish_results: true

      - name: Upload SARIF results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee #4.15.5
        with:
          sarif_file: results.sarif
          category: scorecard
