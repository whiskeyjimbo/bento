# The headline claim: a read grant over all of $HOME does not lift the built-in
# credential shields. read.granted and read.ungranted should both be ALLOWED
# (the whole tree is readable), while every read.shield-* probe still comes back
# DENIED. A shield probe reporting ALLOWED here is a real finding.
#
# The tilde must be quoted: unquoted, YAML reads a bare `~` as null rather than a
# path. Either way, check the run's "credential/host-service path(s) shielded"
# count is non-zero before believing any DENIED here - a grant that reaches
# nothing makes every shield probe pass vacuously.
#
# There is deliberately no write grant: a write grant covering home is refused
# outright, which is worth confirming by hand once with `bento validate`.
entrypoint: ./probe.py
interpreter: python3
args: [read, env]
env: [LANG, BENTO_PROBE_HOME]
read: ["~"]
exec: none
